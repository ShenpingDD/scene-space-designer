# CLA 助手：第一个 PR 自动要求签署，签署记录按 GitHub 账号留痕。
# 双许可项目必须做这一步 —— 没有 CLA，任何一次对外转授权都缺法律基础。
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/ShenpingDD/scene-space-designer/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ShenpingDD,dependabot[bot]
